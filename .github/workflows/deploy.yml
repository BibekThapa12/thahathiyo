name: Check build & save new YouTube uploads

# The site is hosted on Vercel (https://thahathiyo.vercel.app), which rebuilds on every push to main.
# This workflow only checks that the site builds, and once a day saves new YouTube uploads from the
# RSS feed into videos.json; that commit is what makes Vercel publish them.

on:
  push:
    branches: [main]
  schedule:
    # Every day at 02:15 UTC (08:00 Nepal time)
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write # commits new YouTube uploads back to videos.json

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build (merges the YouTube RSS feed)
        run: npm run build
        env:
          WRITE_BACK: "1"
      - name: Save YouTube matches to videos.json
        # A failed push (e.g. you pushed meanwhile) is fine; tomorrow's run retries.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json
          git diff --cached --quiet || { git commit -m "Save YouTube uploads from RSS" && git push || echo "::warning::push failed; will retry next run"; }
