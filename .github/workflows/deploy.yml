name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every day at 02:15 UTC (08:00 Nepal time): pulls new uploads from the YouTube RSS feed.
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write # commits YouTube matches back to videos.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check
      - name: Build (merges the YouTube RSS feed)
        run: npm run build
        env:
          # Custom domain? Set repository variables SITE_URL=https://thahathiyo.com and BASE_PATH=/
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path || '/' }}
          WRITE_BACK: "1"
      - name: Save YouTube matches to videos.json
        # A failed push (e.g. you pushed meanwhile) must not block the deploy; tomorrow's run retries.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json
          git diff --cached --quiet || { git commit -m "Save YouTube uploads from RSS" && git push || echo "::warning::push failed; will retry next run"; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
